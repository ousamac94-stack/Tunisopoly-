<head>

    <title>Tunisopoly — Viaggio in Tunisia (Ousama &amp; Ones)</title>
    <!-- Font calligrafici orientali (non bloccanti con display=swap e fallback immediato) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&family=El+Messiri:wght@600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">

    <!-- PeerJS per connessione diretta P2P senza server/database -->

    <style>
        /* ======================================================================
           DESIGN TOKENS & TEMA MOSAICO TUNISINO / ZELLIGE ORIENTALE
           ====================================================================== */
        :root {
            --med-navy: #1e3a8a;
            --med-blue: #2563eb;
            --med-sky: #38bdf8;
            --med-gold: #fbbf24;
            --med-amber: #d97706;
            --med-sand: #fef3c7;
            --med-cream: #fffdf7;
            --font-oriental: 'El Messiri', 'Reem Kufi', 'Amiri', 'Georgia', serif;
            --font-arabic-script: 'Amiri', 'El Messiri', serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh;
            font-family: 'El Messiri', 'Trebuchet MS', 'Avenir Next', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.85) 0%, transparent 28%),
                radial-gradient(circle at 84% 16%, rgba(253, 224, 71, 0.45) 0%, transparent 32%),
                linear-gradient(180deg, #1d4ed8 0%, #38bdf8 34%, #e0f2fe 68%, #fef3c7 100%);
            color: #1e293b;
            overflow-x: hidden;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        .font-story {
            font-family: var(--font-oriental);
            letter-spacing: 0.02em;
        }

        .font-arabic-ornate {
            font-family: var(--font-arabic-script);
            letter-spacing: 0.01em;
        }

        @keyframes floatSoft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .float-soft {
            animation: floatSoft 2.8s ease-in-out infinite;
        }

        @keyframes bounceToken {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-7px) scale(1.12); }
        }
        .token-active {
            animation: bounceToken 1.2s ease-in-out infinite;
            filter: drop-shadow(0 8px 10px rgba(30, 58, 138, 0.55));
        }

        /* ======================================================================
           VERI DADI CUBICI 3D (6 FACCE CON PERSPECTIVE & PRESERVE-3D)
           ====================================================================== */
        .dice-scene {
            width: 56px;
            height: 56px;
            perspective: 420px;
            display: inline-block;
        }
        @media (min-width: 640px) {
            .dice-scene {
                width: 66px;
                height: 66px;
            }
        }
        .dice-cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.85s cubic-bezier(0.22, 1.25, 0.36, 1);
            transform: rotateX(-22deg) rotateY(28deg);
        }
        @keyframes cubeTumble3D {
